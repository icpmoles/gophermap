name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
          queries: security-extended

      - name: Build Go packages for CodeQL
        run: |
           go build \
            -ldflags="-s -w -X main.Version="TEST_VERSION"" \
            -trimpath -v ./...

      - name: Go Tests
        run: |
          gotestsum \
            --format standard-verbose \
            --junitfile "TestResults-${{ matrix.go-version }}.xml" \
            -- -race ./...

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d
        if: always()
        with:
          files: |
            TestResults-*.xml

      # always() to upload results also incase of failure
      - name: Upload Go test results
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: Go-results-${{ matrix.go-version }}
          path: TestResults-${{ matrix.go-version }}.json

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
