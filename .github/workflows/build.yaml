name: Build GopherMap

on: [push]

permissions:
  contents: write

jobs:
  # avoids building in parallel if it's going to fail regardless
  test-build:
    runs-on: ubuntu-latest  
    strategy:
      matrix:
        go-version: ['1.27.1']
        goos: [linux]
        goarch: [amd64]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test
        run: |
          set -o pipefail
          go test -race -json ./... | tee TestResults-${{ matrix.go-version }}.json \
            | jq -rj 'select(.Action == "output") | .Output'

      # always() to upload results also incase of failure
      - name: Upload Go test results
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: Go-results-${{ matrix.go-version }}
          path: TestResults-${{ matrix.go-version }}.json

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-s -w -X main.Version="TEST_VERSION"" \
            -trimpath -v \
            -o cli_gophermap cmd/cli.go
          
          ./cli_gophermap -h
          ./cli_gophermap https://exmaple.com
          
          


  build:
    needs: test-build
    runs-on: ubuntu-latest
    env:
      GO_VERSION: '1.27.1'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # targets, flags and versioning live in magefile.go (mage buildAll)
      - name: Build
        run: go tool mage buildAll

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: gophermap-go-${{ env.GO_VERSION }}
          path: dist/release-**.tar.gz
          retention-days: 7

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.03
        if: github.ref_type == 'tag'
        with:
          files: |
            dist/release-**.tar.gz
