name: Build GopherMap

on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.x', "stable"]
        goos: [windows, darwin, linux]
        goarch: [amd64, arm64]
        include:
        - goos: linux
          goarch: arm
          goarm: 7
          go-version: 1.26.x
        - goos: linux
          goarch: arm
          goarm: 6
          go-version: 1.26.x
        - goos: linux
          goarch: arm
          goarm: 5
          go-version: 1.26.x

    steps:
      - uses: actions/checkout@v6
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Display Go version
        run: go version

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0

        run: |
          mkdir -p dist
          
          if [ "${{ matrix.goarch }}" = "arm" ]; then
            name_triplet="gophermap-${{ matrix.goos }}-${{ matrix.goarch }}v${{ matrix.goarm }}"
          else
            name_triplet="gophermap-${{ matrix.goos }}-${{ matrix.goarch }}"
          fi

          if [ "${{ matrix.goos }}" = "windows" ]; then
            filename="${name_triplet}/gophermap.exe"
          else
            filename="${name_triplet}/gophermap"
          fi

          output_path=dist/$name_triplet

          go build \
            -ldflags="-s -w" \
            -trimpath -v \
            -o "dist/$filename" cli/main.go

          tar -cvz -f dist/release-$name_triplet.tar.gz \
            -C dist "$name_triplet" 

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: gophermap-${{ matrix.goos }}-${{ matrix.goarch }}@${{ matrix.go-version }}v${{ matrix.goarm }}
          path: dist/release-**.tar.gz

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.03
        if: github.ref_type == 'tag' && matrix.go-version == '1.26.x'
        with:
          files: |
            dist/release-**.tar.gz
